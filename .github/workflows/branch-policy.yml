name: Branch policy

on:
  pull_request:
    branches:
      - main
      - staging
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce staging promotion path
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "staging" ]]; then
            echo "::error::Pull requests into main must come from staging."
            exit 1
          fi

          if [[ "$BASE_REF" == "staging" && "$HEAD_REF" == "main" ]]; then
            echo "::error::Changes to staging must come from a feature branch, not main."
            exit 1
          fi
